services:
  core:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        USERNAME: bao
    image: eureka/core:latest
    hostname: core-container
    extra_hosts:
      - "core-container:127.0.0.1"
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    group_add:
      - dialout
      - video
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/home/bao/.Xauthority
      - QT_QPA_PLATFORM=xcb
      - QT_X11_NO_MITSHM=1
    volumes:
      - .:/home/bao/robot_ws
      - /dev:/dev_host
      - /dev/shm:/dev/shm
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/dev/null}:/home/bao/.Xauthority:ro
